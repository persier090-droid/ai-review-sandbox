<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>全链路AI需求评审沙盘｜专家会诊控制台</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Roboto, "PingFang SC", "Microsoft Yahei", sans-serif;
    }

    :root {
      --brand: #165DFF;
      --brand-soft: #E8F3FF;
      --brand-hover: #0E4BDB;
      --text-1: #1D2129;
      --text-2: #4E5969;
      --text-3: #86909C;
      --line: #E5E6EB;
      --line-soft: #F2F3F5;
      --bg: #F5F7FA;
      --card: #FFFFFF;
      --success: #00B42A;
      --warning: #FF7D00;
      --danger: #F53F3F;
      --info: #165DFF;
      --radius-s: 8px;
      --radius-m: 12px;
      --radius-l: 18px;
      --shadow-1: 0 4px 20px rgba(17, 48, 86, 0.06);
      --shadow-2: 0 8px 30px rgba(17, 48, 86, 0.10);
    }

    body {
      background:
        radial-gradient(circle at 12% 8%, rgba(22, 93, 255, 0.08), transparent 28%),
        radial-gradient(circle at 88% 12%, rgba(22, 93, 255, 0.05), transparent 32%),
        var(--bg);
      color: var(--text-1);
      padding: 24px;
      min-height: 100vh;
    }

    .app-container {
      max-width: 1720px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 20px;
      align-items: start;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius-l);
      border: 1px solid var(--line-soft);
      box-shadow: var(--shadow-1);
      padding: 22px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-1);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
    }

    .card-title::before {
      content: "";
      width: 4px;
      height: 14px;
      border-radius: 2px;
      background: linear-gradient(180deg, #165DFF, #4080FF);
    }

    .section-title {
      font-size: 13px;
      color: var(--text-2);
      font-weight: 500;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .section-title .count {
      font-size: 12px;
      color: var(--text-3);
      font-weight: 400;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      font-size: 13px;
      color: var(--text-2);
      font-weight: 500;
      margin-bottom: 8px;
      display: block;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid #E5E6EB;
      border-radius: var(--radius-s);
      padding: 10px 14px;
      font-size: 13px;
      background: #FFFFFF;
      color: var(--text-1);
      transition: border-color .2s, box-shadow .2s, background .2s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(22, 93, 255, 0.12);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
      line-height: 1.6;
    }

    /* 左侧岗位胶囊点选区 */
    .role-container {
      background: #FAFBFC;
      border: 1px solid #EDEFF2;
      border-radius: var(--radius-m);
      padding: 12px;
      max-height: 310px;
      overflow-y: auto;
    }

    .role-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .role-chip {
      border: 1px solid #E5E6EB;
      background: #FFFFFF;
      color: var(--text-2);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
      transition: all .2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .role-chip:hover {
      border-color: #BFD6FF;
      background: #F7FAFF;
      transform: translateY(-1px);
    }

    .role-chip.active {
      background: var(--brand);
      color: #FFFFFF;
      border-color: var(--brand);
      box-shadow: 0 6px 16px rgba(22, 93, 255, 0.25);
    }

    .role-chip .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #C9CDD4;
      transition: background .2s;
    }

    .role-chip.active .dot {
      background: #FFFFFF;
    }

    .role-chip .remove {
      margin-left: 2px;
      font-size: 12px;
      opacity: 0.7;
    }

    .role-chip.add-custom {
      border-style: dashed;
      color: var(--brand);
      background: #F7FAFF;
    }

    .role-chip.add-custom:hover {
      background: #E8F3FF;
    }

    /* 按钮 */
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      padding: 11px 16px;
      border-radius: var(--radius-s);
      transition: all .2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #165DFF, #4080FF);
      color: #FFFFFF;
      box-shadow: 0 8px 20px rgba(22, 93, 255, 0.28);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #0E4BDB, #165DFF);
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(22, 93, 255, 0.34);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      background: #BFD6FF;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .btn-default {
      background: #F2F3F5;
      color: var(--text-1);
      border: 1px solid #E5E6EB;
    }

    .btn-default:hover {
      background: #EDEFF2;
    }

    .btn-warning {
      background: #FFF3E2;
      color: #D97000;
      border: 1px solid #FFD28B;
    }

    .btn-warning:hover {
      background: #FFE2B8;
    }

    .btn-success {
      background: linear-gradient(135deg, #00B42A, #23C343);
      color: #FFFFFF;
      box-shadow: 0 8px 20px rgba(0, 180, 42, 0.24);
    }

    .btn-success:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(0, 180, 42, 0.30);
    }

    /* 右侧主区域 */
    .main-card {
      background: #FFFFFF;
      border: 1px solid #EDEFF2;
      border-radius: var(--radius-l);
      box-shadow: var(--shadow-1);
      padding: 22px;
    }

    .main-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .main-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-1);
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #C9CDD4;
    }

    .status-dot.wait { background: #C9CDD4; }
    .status-dot.running { background: #165DFF; box-shadow: 0 0 0 4px rgba(22, 93, 255, 0.14); }
    .status-dot.end { background: #00B42A; box-shadow: 0 0 0 4px rgba(0, 180, 42, 0.14); }

    .status-tag {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #F2F3F5;
      color: var(--text-2);
    }

    .status-tag.running { background: #E8F3FF; color: #165DFF; }
    .status-tag.end { background: #E6FFED; color: #007D39; }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 4px;
      background: #F7FAFF;
      border: 1px solid #EDEFF2;
      border-radius: var(--radius-m);
      padding: 6px;
      margin-bottom: 16px;
    }

    .tab-item {
      flex: 1;
      text-align: center;
      padding: 9px 12px;
      font-size: 13px;
      color: var(--text-2);
      border-radius: 10px;
      cursor: pointer;
      transition: all .2s ease;
    }

    .tab-item:hover {
      color: var(--text-1);
      background: rgba(255,255,255,0.6);
    }

    .tab-item.active {
      background: #FFFFFF;
      color: var(--brand);
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(22, 93, 255, 0.12);
    }

    /* 干预提示 */
    .alert-banner {
      background: linear-gradient(90deg, #FFF7E8, #FFF3E2);
      border: 1px solid #FFCB74;
      color: #D97000;
      padding: 12px 14px;
      border-radius: var(--radius-s);
      margin-bottom: 14px;
      font-size: 13px;
      display: none;
      align-items: center;
      gap: 10px;
    }

    .alert-banner.show {
      display: flex;
      animation: slideIn .25s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Tab 面板 */
    .tab-panel {
      display: none;
      animation: fadeIn .25s ease;
    }

    .tab-panel.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 聊天区 */
    .chat-container {
      height: 440px;
      overflow-y: auto;
      background:
        radial-gradient(circle at 10% 0%, rgba(22, 93, 255, 0.06), transparent 30%),
        #FAFBFC;
      border: 1px solid #EDEFF2;
      border-radius: var(--radius-m);
      padding: 18px;
    }

    .msg-wrap {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      animation: msgIn .3s ease;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-self {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: #FFFFFF;
      flex-shrink: 0;
      background: linear-gradient(135deg, #86909C, #4E5969);
    }

    .msg-self .avatar {
      background: linear-gradient(135deg, #165DFF, #4080FF);
    }

    .msg-other .avatar {
      background: linear-gradient(135deg, #4080FF, #82B1FF);
    }

    .msg-box {
      max-width: 72%;
      background: #FFFFFF;
      border: 1px solid #EDEFF2;
      border-radius: 16px;
      padding: 12px 14px;
      box-shadow: 0 4px 14px rgba(17, 48, 86, 0.04);
      position: relative;
    }

    .msg-self .msg-box {
      background: linear-gradient(135deg, #165DFF, #4080FF);
      color: #FFFFFF;
      border-color: #165DFF;
      box-shadow: 0 8px 20px rgba(22, 93, 255, 0.18);
    }

    .msg-name {
      font-size: 12px;
      color: var(--text-3);
      margin-bottom: 4px;
      font-weight: 500;
    }

    .msg-self .msg-name {
      color: #CFE0FF;
      text-align: right;
    }

    .msg-intervene-tag {
      display: inline-block;
      padding: 1px 8px;
      margin-left: 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.25);
      color: #FFFFFF;
      vertical-align: middle;
    }

    .msg-other .msg-intervene-tag {
      background: #E8F3FF;
      color: var(--brand);
    }

    .msg-text {
      font-size: 13px;
      line-height: 1.65;
      color: var(--text-1);
      white-space: pre-wrap;
    }

    .msg-self .msg-text {
      color: #FFFFFF;
    }

    .msg-time {
      font-size: 11px;
      color: #C9CDD4;
      margin-top: 6px;
    }

    .msg-self .msg-time {
      text-align: right;
      color: #CFE0FF;
    }

    .msg-system {
      justify-content: center;
    }

    .msg-system .msg-box {
      background: #F7FAFF;
      color: var(--text-2);
      text-align: center;
      font-size: 12px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid #E5F0FF;
    }

    /* 干预输入区 */
    .intervene-area {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      background: #FAFBFC;
      border: 1px solid #EDEFF2;
      border-radius: var(--radius-m);
      padding: 12px;
    }

    .intervene-area input {
      flex: 1;
      background: #FFFFFF;
    }

    /* 结果面板 */
    .result-panel {
      display: none;
    }

    .result-panel.show {
      display: block;
    }

    .summary-block {
      background: linear-gradient(135deg, #F7FAFF, #E8F3FF);
      border: 1px solid #D0E5FF;
      border-radius: var(--radius-m);
      padding: 16px;
      margin-bottom: 16px;
    }

    .summary-block h4 {
      font-size: 14px;
      color: var(--brand);
      margin-bottom: 10px;
    }

    .summary-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .meta-pill {
      background: #FFFFFF;
      border: 1px solid #D0E5FF;
      color: var(--text-2);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
    }

    .meta-pill b {
      color: var(--text-1);
      margin-right: 4px;
    }

    .question-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .question-item {
      background: #FFFFFF;
      border: 1px solid #EDEFF2;
      border-radius: var(--radius-s);
      padding: 10px 12px;
      font-size: 13px;
      color: var(--text-1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .question-item .left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .question-item .owner {
      color: var(--text-3);
      font-size: 12px;
      flex-shrink: 0;
    }

    .question-item.is-solved .q-text {
      text-decoration: line-through;
      color: var(--text-3);
    }

    .question-item.is-solved .risk-tag {
      opacity: 0.4;
    }

    .q-checkbox {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .q-checkbox input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .q-checkmark {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 1.5px solid #C9CDD4;
      border-radius: 5px;
      background: #FFFFFF;
      transition: all .15s ease;
    }

    .q-checkbox:hover .q-checkmark {
      border-color: var(--brand);
    }

    .q-checkbox input:checked + .q-checkmark {
      background: var(--brand);
      border-color: var(--brand);
    }

    .q-checkbox input:checked + .q-checkmark::after {
      content: "";
      position: absolute;
      left: 5px;
      top: 2px;
      width: 5px;
      height: 9px;
      border: solid #FFFFFF;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .risk-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      color: #FFFFFF;
      flex-shrink: 0;
    }

    .risk-tag.high { background: #F53F3F; }
    .risk-tag.mid { background: #FF7D00; }
    .risk-tag.low { background: #00B42A; }

    /* 分数卡片 */
    .score-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-top: 12px;
    }

    .score-card {
      background: #FFFFFF;
      border: 1px solid #EDEFF2;
      border-radius: var(--radius-m);
      padding: 16px 14px;
      text-align: center;
      transition: transform .2s;
    }

    .score-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-2);
    }

    .score-label {
      font-size: 12px;
      color: var(--text-3);
      margin-bottom: 6px;
    }

    .score-value {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-1);
    }

    .score-card.good .score-value { color: #00B42A; }
    .score-card.mid .score-value { color: #FF7D00; }
    .score-card.bad .score-value { color: #F53F3F; }

    .score-bar {
      width: 100%;
      height: 6px;
      background: #F2F3F5;
      border-radius: 999px;
      margin-top: 10px;
      overflow: hidden;
    }

    .score-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #165DFF, #4080FF);
      transition: width .4s ease;
    }

    .score-card.good .score-bar-fill { background: linear-gradient(90deg, #00B42A, #23C343); }
    .score-card.mid .score-bar-fill { background: linear-gradient(90deg, #FF7D00, #FFA940); }
    .score-card.bad .score-bar-fill { background: linear-gradient(90deg, #F53F3F, #FF7875); }

    /* 风险看板 */
    .risk-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 12px;
    }

    .risk-card {
      border-radius: var(--radius-m);
      padding: 16px;
      background: #FFFFFF;
      border: 1px solid #EDEFF2;
    }

    .risk-card h4 {
      font-size: 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .risk-card .risk-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .risk-item {
      background: #FFFFFF;
      border: 1px solid #EDEFF2;
      border-radius: var(--radius-s);
      padding: 10px 12px;
      font-size: 13px;
      color: var(--text-1);
    }

    .risk-item .risk-owner {
      font-size: 12px;
      color: var(--text-3);
      margin-bottom: 4px;
    }

    .risk-card.high { border-color: #FFD8D8; background: linear-gradient(180deg, #FFF7F7, #FFFFFF); }
    .risk-card.high h4 { color: #F53F3F; }
    .risk-card.mid { border-color: #FFE7BF; background: linear-gradient(180deg, #FFFBF0, #FFFFFF); }
    .risk-card.mid h4 { color: #FF7D00; }
    .risk-card.low { border-color: #C8F1D3; background: linear-gradient(180deg, #F3FFF6, #FFFFFF); }
    .risk-card.low h4 { color: #00B42A; }

    /* 表格 */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    th, td {
      border: 1px solid #EDEFF2;
      padding: 12px;
      text-align: left;
      font-size: 13px;
    }

    th {
      background: #FAFBFC;
      color: var(--text-2);
      font-weight: 600;
    }

    tr:hover td {
      background: #FAFBFC;
    }

    .priority-tag {
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .priority-high { background: #FFECE8; color: #F53F3F; }
    .priority-mid { background: #FFF7E8; color: #D97000; }
    .priority-low { background: #E6FFED; color: #007D39; }

    /* 文档区 */
    .doc-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .prd-block {
      background: #FAFBFC;
      border: 1px solid #EDEFF2;
      border-radius: var(--radius-m);
      padding: 20px;
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-wrap;
      max-height: 520px;
      overflow: auto;
    }

    /* 滚动条美化 */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-thumb {
      background: #D9DEE4;
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #C9CDD4;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }

    /* Toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%) translateY(20px);
      background: #1D2129;
      color: #FFFFFF;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: all .3s ease;
      z-index: 999;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- 左侧配置面板 -->
  <div class="card">
    <div class="card-title">全链路沙盘配置中心</div>

    <div class="form-group">
      <label>业务场景</label>
      <select id="bizScene">
        <option value="ktv">KTV点歌机｜软硬件融合业务</option>
        <option value="car">车载智能终端｜车机软硬件</option>
        <option value="saas">企业SaaS后台｜云端业务</option>
        <option value="app">移动端APP｜用户端产品</option>
        <option value="web">Web管理平台｜运营后台</option>
      </select>
    </div>

    <div class="form-group">
      <div class="section-title">
        <span>参会岗位</span>

  if (!req) return "本功能";
  const cleaned = req.replace(/[，。、！？；：,.!?;:"'\n\r\t]/g, " ").trim();
  return cleaned.length > maxLen ? cleaned.slice(0, maxLen) + "…" : cleaned;
}

    `关于${questionHint || "大家提到的问题"}，我们考虑过：当前版本先覆盖主流场景，边缘场景留到下一期迭代，优先保证主流程稳定。`,
    `${topic}的优先级是经过业务侧确认的，排期和资源已经协调好，风险整体可控。`,
    `性能和兼容性我们会在开发阶段重点验证，灰度阶段持续观察，有问题随时回滚。`
  ];
  return pickRandom(answers, 1)[0];
}

// 生成角色追问/反驳话术
function generateRoleFollowUp(roleKey, roleName, reqText) {
  const topic = extractReqTopic(reqText);
  const followUps = {
    sales: [`如果${topic}效果不达预期，客户投诉怎么应对？有没有退费风险？`, `这个功能能不能包装成增值服务单独收费？`],
    op: [`${topic}的数据看板什么时候能出？运营需要第一时间看到效果。`, `素材审核流程不能省，不然很容易出合规问题。`],
    project: [`排期如果压缩，那质量怎么保障？要不要砍掉一些非核心功能？`, `灰度比例和周期需要提前定好，别到时候临时拍脑袋。`],
    client: [`本地存储占用是个问题，用户硬盘不足时怎么办？有没有自动清理机制？`, `低配机型性能指标有没有基线？低于多少就不展示${topic}？`],
    server: [`接口响应时间SLA是多少？${topic}对整体服务性能影响大不大？`, `数据一致性怎么保障？会不会出现脏数据？`],
    h5: [`不同端的UI一致性怎么保障？会不会出现iOS和安卓表现不一样？`, `加载超时阈值定多少？超时后降级成什么样子？`],
    test: [`自动化测试覆盖率要求多少？${topic}的核心流程必须覆盖吧？`, `线上灰度期间的异常监控有没有对接？出问题能及时告警吗？`],
    service: [`故障排查路径能不能简化？最好能一键诊断，不然售后效率太低。`, `用户培训材料和FAQ要提前准备，不然上线后投诉会爆。`]
  };
  const pool = followUps[roleKey] || [`${topic}的细节还需要再确认一下，不然落地容易出问题。`];
  return pickRandom(pool, 1)[0];
}

function buildKtvMultiScript(userReq) {
  const script = [];
  const checkedRoles = getCheckedRoles();
  globalQuestions = [];

  // PM 开场（蓝色气泡）
  script.push({role:"pd",name:"产品经理",text:`本次迭代需求：${userReq}\n请各位参会岗位从各自专业角度评审，提出风险点和疑问。`});

  // 第一轮：各角色依次提出核心疑问
  const nonPdRoles = checkedRoles.filter(r => r.key !== "pd");
  const firstRoundQuestions = [];
  for (const r of nonPdRoles) {
    const qText = generateRoleQuestion(r.key, r.name, userReq, 0);
    const q = {
      text: qText,
      level: r.key === "client" || r.key === "server" || r.key === "project" ? "high" : (r.key === "test" || r.key === "sales" ? "mid" : "low"),
      category: r.key,
      owner: r.name,
      solved: false
    };
    firstRoundQuestions.push(q);
    globalQuestions.push(q);
    script.push({role: r.key, name: r.name, text: qText});
  }

  // PM 回应前 2 个高风险问题
  const highProfile = firstRoundQuestions.filter(q => q.level === "high").slice(0, 2);
  if (highProfile.length > 0) {
    const hint = highProfile.map(q => q.owner + "提到的" + extractReqTopic(q.text, 10)).join("、");
    script.push({role:"pd",name:"产品经理",text:`关于${hint}这几个核心问题，我统一回应一下：${generatePdAnswer(userReq, "核心风险")}`});
  }

  // 第二轮：随机 3-4 个角色针对 PM 回答继续追问
  const followRoles = pickRandom(nonPdRoles, Math.min(Math.max(3, Math.floor(nonPdRoles.length * 0.5)), nonPdRoles.length));
  for (const r of followRoles) {
    const followText = generateRoleFollowUp(r.key, r.name, userReq);
    script.push({role: r.key, name: r.name, text: followText});
    // 追问作为新增疑点
    const newQ = {
      text: followText.length > 45 ? followText.slice(0, 42) + "…" : followText,
      level: "mid",
      category: r.key,
      owner: r.name,
      solved: false
    };
    globalQuestions.push(newQ);
  }

  // PM 再次回应并做阶段性总结
  script.push({role:"pd",name:"产品经理",text:`感谢各位的深入提问。${generatePdAnswer(userReq, "落地细节")} 具体细节我们会后逐项对齐，确保各方风险可控。`});

  // 第三轮：跨角色互动——某角色补充另一角色的观点
  const crossRoles = pickRandom(nonPdRoles, Math.min(2, nonPdRoles.length));
  if (crossRoles.length >= 2) {
    const r1 = crossRoles[0];
    const r2 = crossRoles[1];
    script.push({role: r1.key, name: r1.name, text:`补充一下，我同意${r2.name}的观点，「${extractReqTopic(userReq, 8)}」这块如果边界不先明确，后续返工风险确实很大。`});
  }

  script.push({role:"pd",name:"产品经理",text:"好的，各位的疑问和建议我都记录下来了。我们汇总一下本次评审的所有疑点，评估整体风险和落地可行性。"});
  return script;
}

function buildInterveneScript(changeText) {
  const script = [];
  const checkedRoles = getCheckedRoles().filter(r => r.key !== "pd");

  // PM 发布变更（蓝色气泡，带人工干预标记）
  script.push({
    role: "pd",
    name: "产品经理",
    text: changeText,
    isIntervene: true
  });

  // 第一轮：各角色针对变更内容提出新疑问（基于变更文本动态生成）
  const activeRoles = pickRandom(checkedRoles, Math.min(Math.max(3, Math.floor(checkedRoles.length * 0.6)), checkedRoles.length));
  for (let i = 0; i < activeRoles.length; i++) {
    const r = activeRoles[i];
    const qText = generateRoleQuestion(r.key, r.name, changeText, i + 1);
    const q = {
      text: qText,
      level: i < 2 ? "high" : (i < 4 ? "mid" : "low"),
      category: r.key,
      owner: r.name,
      solved: false
    };
    globalQuestions.push(q);
    script.push({role: r.key, name: r.name, text: qText});
  }

  // PM 针对变更做出回应
  script.push({
    role: "pd",
    name: "产品经理",
    text: `关于这次变更，我补充说明一下：${generatePdAnswer(changeText, "变更影响")} 大家还有其他顾虑可以继续提。`
  });

  // 第二轮：2-3 个角色继续追问或反驳
  const restRoles = checkedRoles.filter(r => !activeRoles.some(ar => ar.key === r.key));
  const followRoles = pickRandom(
    restRoles.concat(pickRandom(activeRoles, 1)),
    Math.min(3, checkedRoles.length - 1)
  );
  for (const r of followRoles) {
    const followText = generateRoleFollowUp(r.key, r.name, changeText);
    script.push({role: r.key, name: r.name, text: followText});
    // 追问也作为新增疑点
    const followQ = {
      text: followText.length > 45 ? followText.slice(0, 42) + "…" : followText,
      level: "mid",
      category: r.key,
      owner: r.name,
      solved: false
    };
    globalQuestions.push(followQ);
  }

  // PM 总结变更影响
  script.push({
    role: "pd",
    name: "产品经理",
    text: "感谢各位的快速反馈。变更带来的影响点我都记录了，会后整理变更影响评估清单，同步给大家确认后再推进开发。"
  });

  return script;
}

function parseReviewContent() {
  const risks = [];
  globalQuestions.forEach(q => {
    if (!q.solved) {
      risks.push({text: q.text, owner: q.owner, level: q.level});
    }
  });
  return {questions: globalQuestions.filter(q => !q.solved), risks};
}

function calcScore(questionList) {
  let reqDeduct = 0, techDeduct = 0, deliverDeduct = 0, opDeduct = 0, serviceDeduct = 0;
  const weightMap = {"high": 8, "mid": 4, "low": 1};
  questionList.forEach(q => {
    const w = weightMap[q.level];
    switch (q.category) {
      case "pd": reqDeduct += w; break;
      case "client": case "server": techDeduct += w; break;
      case "project": deliverDeduct += w; break;
      case "sales": case "op": opDeduct += w; break;
      case "test": case "service": serviceDeduct += w; break;
    }
  });
  return {
    reqComplete: Math.max(40, 90 - reqDeduct),
    techFeasible: Math.max(40, 90 - techDeduct),
    deliverCtrl: Math.max(40, 90 - deliverDeduct),
    opLand: Math.max(40, 90 - opDeduct),
    serviceFriendly: Math.max(40, 90 - serviceDeduct),
  }
}

function showToast(msg) {

function renderRoles() {
  let html = "";
  ALL_ROLES.forEach((r, idx) => {
    html += `
      <div class="role-chip ${r.checked ? 'active' : ''}" data-role-index="${idx}">
        <span class="dot"></span>
        <span>${r.name}</span>
      </div>
    `;
  });
  html += `<div class="role-chip add-custom" id="addCustomRoleCard">+ 自定义职能</div>`;
  roleBox.innerHTML = html;
  updateRoleCount();

  document.querySelectorAll(".role-chip").forEach(card => {
    card.onclick = function () {
      if (this.id === "addCustomRoleCard") {
        const inputName = prompt("请输入岗位职能名称：");
        if (!inputName || inputName.trim() === "") return;
        const name = inputName.trim();
        const newKey = "custom_" + Date.now();
        const newRole = {key: newKey, name: name, avatar: name.slice(0, 2), checked: true};
        ALL_ROLES.push(newRole);
        renderRoles();
        showToast("已新增岗位：" + name);
        return;
      }
      const idx = Number(this.dataset.roleIndex);
      ALL_ROLES[idx].checked = !ALL_ROLES[idx].checked;
      this.classList.toggle("active");
      updateRoleCount();
    }
  });
}

function updateRoleCount() {
  const count = ALL_ROLES.filter(r => r.checked).length;
  roleCount.textContent = `已选 ${count} 人`;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function playList(list) {
  isPlaying = true;
  // 播放中锁定按钮状态
  startBtn.disabled = true;
  interveneBtn.disabled = true;
  endBtn.disabled = true;
  statusTag.textContent = "评审中";
  statusTag.className = "status-tag running";
  statusDot.className = "status-dot running";

  while (ptr < list.length) {
    appendMessage(list[ptr]);
    ptr++;
    await sleep(1200);
  }

  isPlaying = false;
  // 恢复按钮状态
  startBtn.disabled = false;
  interveneBtn.disabled = false;
  endBtn.disabled = false;
  // 状态标签保持评审中（未结束前），结束评审时由endBtn处理
}

  chatBox.innerHTML = "";
  ptr = 0;
  isPlaying = false;
  globalQuestions = [];
  alertBanner.classList.remove("show");
  docArea.style.display = "none";
  statusTag.textContent = "待启动";

// ====================== 干预逻辑 ======================
interveneBtn.onclick = async () => {
  try {
    const txt = interveneInput.value.trim();
    if (!txt) {
      interveneInput.focus();
      interveneInput.style.borderColor = "var(--danger)";
      interveneInput.style.boxShadow = "0 0 0 3px rgba(245, 63, 63, 0.12)";
      showToast("请输入需求变更内容后再提交");
      setTimeout(() => {
        interveneInput.style.borderColor = "";
        interveneInput.style.boxShadow = "";
      }, 1500);
      return;
    }
    if (isPlaying) {
      showToast("评审正在进行中，请稍候再提交");
      return;
    }
    if (ptr === 0) {
      showToast("请先启动评审，再提交变更");
      return;
    }

    // 按钮点击反馈：立即置灰防重复提交
    interveneBtn.disabled = true;
    alertBanner.classList.add("show");
    alertBanner.textContent = `已收到需求变更：${txt.slice(0, 40)}${txt.length > 40 ? "…" : ""}`;

    const addScript = buildInterveneScript(txt);
    currentScript = currentScript.concat(addScript);
    await playList(addScript);

    interveneInput.value = "";
    interveneBtn.disabled = false;
    showToast("变更已注入，评审推演完成");

    if (document.getElementById("scoreResultPanel").classList.contains("show")) {
      renderResultPanels();
    }
  } catch (e) {
    console.error("提交变更失败：", e);
    showToast("提交失败，请重试");
    interveneBtn.disabled = false;
  }
}

  statusTag.textContent = "评审完成";
  statusTag.className = "status-tag end";

  const checkedRoles = getCheckedRoles();
  const {questions, risks} = parseReviewContent();
  const highRisks = risks.filter(r => r.level === "high");
  const midRisks = risks.filter(r => r.level === "mid");
  const lowRisks = risks.filter(r => r.level === "low");
  const scoreObj = calcScore(questions);

  renderResultPanels();

  // 待办
  let todoHtml = "";
  checkedRoles.forEach(r => {
    let todoText = "";
    let priority = "中";
    let priorityClass = "priority-mid";
    switch (r.key) {
      case "pd": todoText = "完善PRD/待确认清单，对齐所有疑问"; priority = "高"; priorityClass = "priority-high"; break;
      case "sales": todoText = "输出客户卖点、FAQ、统一对外口径"; priority = "高"; priorityClass = "priority-high"; break;
      case "op": todoText = "更新后台配置手册、监控指标、异常处理"; priority = "中"; priorityClass = "priority-mid"; break;

      case "h5": todoText = "开发页面、弹窗、适配、交互逻辑"; priority = "高"; priorityClass = "priority-high"; break;
      case "client": todoText = "开发本地逻辑、离线适配、硬件兼容"; priority = "高"; priorityClass = "priority-high"; break;
      case "server": todoText = "接口、幂等、数据校验、定时任务"; priority = "高"; priorityClass = "priority-high"; break;
      case "test": todoText = "编写用例、全场景回归、边界测试"; priority = "高"; priorityClass = "priority-high"; break;
      case "service": todoText = "梳理排查手册、日志监控方案"; priority = "中"; priorityClass = "priority-mid"; break;
      default: todoText = "完成本次评审分配的专项评估"; priority = "中"; priorityClass = "priority-mid";

    todoHtml += `<tr><td>${r.name}</td><td>${todoText}</td><td><span class="priority-tag ${priorityClass}">${priority}</span></td></tr>`;

// ====================== 统一渲染结果面板（疑点+评分+风险，同一数据源） ======================
function renderResultPanels() {
  const {questions, risks} = parseReviewContent();
  const highRisks = risks.filter(r => r.level === "high");
  const midRisks = risks.filter(r => r.level === "mid");
  const lowRisks = risks.filter(r => r.level === "low");
  const scoreObj = calcScore(questions);

  // 摘要统计
  document.getElementById("summaryQuestionCount").textContent = questions.length;
  document.getElementById("summaryHighCount").textContent = highRisks.length;
  document.getElementById("summaryMidCount").textContent = midRisks.length;
  document.getElementById("summaryLowCount").textContent = lowRisks.length;

  // 疑点列表（带勾选框，已解决的划掉）
  let questionHtml = "";
  if (globalQuestions.length === 0) {
    questionHtml = "<div style='font-size:13px;color:var(--text-3);'>本次评审未收集到未对齐疑点</div>";
  } else {
    globalQuestions.forEach((q, idx) => {
      const tagClass = q.level === "high" ? "high" : q.level === "mid" ? "mid" : "low";
      const levelName = q.level === "high" ? "高风险" : q.level === "mid" ? "中风险" : "低风险";
      const solvedClass = q.solved ? "is-solved" : "";
      const checkedAttr = q.solved ? "checked" : "";
      questionHtml += `
        <div class="question-item ${solvedClass}" data-q-idx="${idx}">
          <div class="left">
            <label class="q-checkbox">
              <input type="checkbox" data-q-idx="${idx}" ${checkedAttr}/>
              <span class="q-checkmark"></span>
            </label>
            <span class="risk-tag ${tagClass}">${levelName}</span>
            <span class="q-text">${q.text}</span>
          </div>
          <span class="owner">${q.owner}</span>
        </div>
      `;
    });
  }
  document.getElementById("summaryQuestionList").innerHTML = questionHtml;

  // 绑定勾选事件
  document.querySelectorAll("#summaryQuestionList input[type=checkbox]").forEach(cb => {
    cb.onchange = function () {
      const idx = Number(this.dataset.qIdx);
      toggleQuestionSolved(idx, this.checked);
    };
  });

  // 分数
  const scoreData = [
    {label: "需求完整度", val: scoreObj.reqComplete},
    {label: "技术可行性", val: scoreObj.techFeasible},
    {label: "交付可控性", val: scoreObj.deliverCtrl},
    {label: "运营落地性", val: scoreObj.opLand},
    {label: "售后运维友好度", val: scoreObj.serviceFriendly},
  ];
  let scoreHtml = "";
  scoreData.forEach(s => {
    let cls = "good";
    if (s.val < 70) cls = "bad";
    else if (s.val < 85) cls = "mid";
    scoreHtml += `
      <div class="score-card ${cls}">
        <div class="score-label">${s.label}</div>
        <div class="score-value">${s.val}</div>
        <div class="score-bar"><div class="score-bar-fill" style="width:${s.val}%"></div></div>
      </div>
    `;
  });
  document.getElementById("scoreGrid").innerHTML = scoreHtml;

  // 风险看板
  let riskHtml = "";
  riskHtml += `<div class="risk-card high"><h4>🔴 高风险</h4><div class="risk-list">${highRisks.map(r => `<div class="risk-item"><div class="risk-owner">${r.owner}</div>${r.text}</div>`).join("") || "<div style='font-size:13px;color:var(--text-3);'>无高风险项</div>"}</div></div>`;
  riskHtml += `<div class="risk-card mid"><h4>🟠 中风险</h4><div class="risk-list">${midRisks.map(r => `<div class="risk-item"><div class="risk-owner">${r.owner}</div>${r.text}</div>`).join("") || "<div style='font-size:13px;color:var(--text-3);'>无中风险项</div>"}</div></div>`;
  riskHtml += `<div class="risk-card low"><h4>🟢 低风险</h4><div class="risk-list">${lowRisks.map(r => `<div class="risk-item"><div class="risk-owner">${r.owner}</div>${r.text}</div>`).join("") || "<div style='font-size:13px;color:var(--text-3);'>无低风险项</div>"}</div></div>`;
  document.getElementById("riskGrid").innerHTML = riskHtml;

  // 同步更新交付文档数据源
  window.__reviewResult = {questions, risks};
}

// 疑点勾选：切换已解决状态，实时重算
function toggleQuestionSolved(idx, solved) {
  if (!globalQuestions[idx]) return;
  globalQuestions[idx].solved = solved;
  // 重新渲染所有面板（统一数据源）
  renderResultPanels();
  showToast(solved ? "已标记为已解决，评分已更新" : "已恢复为未解决");
}

// ====================== 生成交付文档 ======================
genDocBtn.onclick = () => {
  if (!window.__reviewResult) {
    showToast("请先结束评审");
    return;
  }
  docArea.style.display = "block";
  const result = window.__reviewResult || parseReviewContent();
  const {questions, risks} = result;
  const sceneName = bizSceneSel.options[bizSceneSel.selectedIndex].text;
  const req = reqInput.value;
  if (questions.length >= 3) {
    docContent.innerText = generateConfirmList(sceneName, req, questions, risks);
  } else {
    docContent.innerText = generatePRD(sceneName, req, questions, risks);
  }
  showToast("交付文档已生成");
}

copyResultBtn.onclick = () => {
  if (!docContent.innerText) {
    showToast("请先生成交付文档");
    return;
  }
  navigator.clipboard.writeText(docContent.innerText);
  showToast("结果已复制");
}
