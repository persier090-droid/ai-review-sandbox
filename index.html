<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全链路AI评审沙盘</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, -apple-system, sans-serif}
body{background:#111827;color:#e5e7eb;padding:24px}
.container{max-width:1200px;margin:0 auto}
h1{font-size:28px;margin-bottom:20px;color:#fff}
.card{background:#1f2937;border-radius:12px;padding:20px;margin-bottom:16px;border:1px solid #374151}
.card h2{font-size:18px;margin-bottom:12px;color:#f9fafb}
textarea,select,input{width:100%;background:#111827;border:1px solid #4b5563;border-radius:8px;padding:12px;color:#e5e7eb;margin:8px 0;font-size:14px}
button{background:#2563eb;color:white;border:none;padding:12px 20px;border-radius:8px;cursor:pointer;font-weight:bold;margin-top:8px}
button:hover{background:#1d4ed8}
#result{white-space:pre-wrap;margin-top:16px;padding:16px;background:#111827;border-radius:8px;border:1px solid #374151;min-height:220px;white-space:pre-wrap;line-height:1.6}
</style>
</head>
<body>
<div class="container">
<h1>全链路AI评审沙盘</h1>
<div class="card">
<h2>评审输入</h2>
<select id="reviewType">
<option value="prd">PRD 产品需求评审</option>
<option value="hardware">硬件方案评审</option>
<option value="risk">项目风险评审</option>
<option value="ui">UI交互评审</option>
<option value="hardware-software">软硬件联合方案评审</option>
</select>
<textarea id="inputContent" rows="10" placeholder="粘贴你的文档内容、需求、硬件方案、风险点、点歌机/十合一硬件方案等..."></textarea>
<button onclick="runReview()">开始AI评审</button>
</div>
<div class="card">
<h2>评审结果</h2>
<div id="result"></div>
</div>
</div>
<script>
function runReview(){
  const type=document.getElementById('reviewType').value;
  const content=document.getElementById('inputContent').value;
  const res=document.getElementById('result');
  if(!content){res.innerText="⚠️ 请输入待评审内容";return}
  res.innerText="正在分析...\n\n【"+type+"】评审报告\n输入摘要："+content.substring(0,180)+"...\n\n✅ 优势：\n1. 业务目标明确，核心业务链路完整\n\n⚠️ 风险点：\n1. 边界场景、异常分支缺少定义\n2. 软硬件依赖、跨模块接口约束未明确\n3. 降级、兜底、故障恢复策略缺失\n4. 验收标准、测试边界没有明确\n\n💡 改进建议：\n- 补充异常场景、降级策略、故障回滚方案\n- 梳理软硬件模块依赖清单、接口时序、版本约束\n- 明确验收标准、边界测试用例\n- 评估排期、资源依赖、派系/项目协作风险";
}
</script>
</body>
</html>
